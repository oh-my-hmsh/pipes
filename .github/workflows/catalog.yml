# 🚨 カタログ（`pipes.json`）は**生成物**。手で編集すると、ここで落ちる。
#
# ⭐ なぜ機械が守るのか: 手書きだった間に 3 つ壊れていた（2026-08-19 実測）——
#   ①載っているのに実体が無い「幽霊」2 件 ②同じ description が実体と別の文
#   ③複製が別リポにも在り、org 改名が片方にしか当たっていなかった。
# ⚠️ **規約に書くだけでは守られなかった**ので、PR の手前で撃つ。
name: catalog
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: カタログが実体と一致しているか
        run: ./build-catalog.py --check

      # ⭐ 宣言した面の実体が在り、linux 面が静的で、**全部が版を名乗る**か。
      # 🚨 版を名乗れない物を配ると、利用者側で「最新か」が『分からない』に化ける
      # —— 直せるのは配る側だけなので、手前で止める。
      - name: 実体が在り、静的で、版を名乗るか
        run: ./check-artifacts.py

      # 🚨 指紋の計算は **2 言語に分かれている**（配る側 Python / 入れる側 Rust）。
      # ⚠️ 食い違うと、宣言が同じでも `flux outdated` が全部を「宣言が古い」と言い続け、
      # **入れ直しても直らない**。⭐ 初回にこれで実バグ（FNV 素数の桁）を捕まえた。
      - name: 指紋の計算が両側で一致しているか
        run: ./check-digest-agreement.py
